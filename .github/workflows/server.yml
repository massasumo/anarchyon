name: Anarchyon

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar e Iniciar Playit.gg
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | sudo apt-key add -
          sudo curl -SsL -o /etc/apt/sources.list.d/playit-cloud.list https://playit-cloud.github.io/ppa/playit-cloud.list
          sudo apt-get update
          sudo apt-get install playit -y

          if [ -n "$PLAYIT_SECRET" ]; then
            echo "Iniciando Playit com Secret Key..."
            playit --secret "$PLAYIT_SECRET" daemon &
          else
            echo "AVISO: PLAYIT_SECRET_KEY não configurada. O Playit gerara um link de reivindicacao no console."
            playit daemon &
          fi

      - name: Executar Servidor
        run: |
          chmod +x start.sh
          ./start.sh

      - name: Salvar e Enviar Progresso
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add world/
          git commit -m "Auto-save do mapa [skip ci]" || echo "Nenhuma alteração para salvar."
          git push