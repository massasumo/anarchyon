name: Anarchyon

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar e Iniciar Ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Download e instalacao do Ngrok
          curl -s https://bin.equinox.io/c/bNyA16AP2xn/ngrok-v3-stable-linux-amd64.tgz | tar -xz
          sudo mv ngrok /usr/local/bin/
          
          # Autenticacao
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # Inicia o tunel TCP para a porta padrao do Minecraft
          ngrok tcp 25565 &
          sleep 5
          
          # Exibe o IP/Porta diretamente no log para voce copiar
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^\"]*' || echo "Aguardando Ngrok iniciar..."

      - name: Executar Servidor
        run: |
          chmod +x start.sh
          ./start.sh

      - name: Salvar e Enviar Progresso
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add world/
          git commit -m "Auto-save do mapa [skip ci]" || echo "Nenhuma alteração para salvar."
          git push