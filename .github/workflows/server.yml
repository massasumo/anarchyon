name: Anarchyon

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar e Iniciar Playit.gg
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit

          if [ -n "$PLAYIT_SECRET" ]; then
            echo "Iniciando Playit com Secret Key..."
            ./playit --secret "$PLAYIT_SECRET" &
          else
            echo "AVISO: PLAYIT_SECRET nao configurada. Gerando link no console..."
            ./playit &
          fi

      - name: Executar Servidor
        run: |
          chmod +x start.sh
          ./start.sh

      - name: Salvar e Enviar Progresso
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add world/
          git commit -m "Auto-save do mapa [skip ci]" || echo "Nenhuma alteração para salvar."
          git push